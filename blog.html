<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #2d3748;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }
        
        header {
            text-align: center;
            padding: 20px 0;
            background-color: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            border-radius: 12px 12px 0 0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        
        header h1 {
            font-size: 24px;
            letter-spacing: 2px;
            margin-bottom: 12px;
            color: #1a202c;
        }
        
        nav a {
            color: #4a5568;
            text-decoration: none;
            font-weight: 600;
            margin: 0 12px;
            transition: color 0.2s ease;
        }
        
        nav a:hover {
            color: #3182ce;
            text-decoration: none;
        }

        .hero-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #ffffff;
            padding: 40px 30px;
            text-align: center;
            border-radius: 0 0 12px 12px;
            margin-bottom: 30px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .hero-section h2 {
            font-size: 32px;
            margin: 0 0 10px 0;
            font-weight: 700;
        }

        .hero-section p {
            font-size: 16px;
            margin: 0;
            opacity: 0.9;
        }

        .posts-wrapper {
            display: grid;
            gap: 25px;
        }

        .post-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border-left: 5px solid #667eea;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .post-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 20px -5px rgba(0, 0, 0, 0.1);
        }

        .post-card h3 {
            margin: 0 0 10px 0;
            font-size: 22px;
        }

        .post-card h3 a {
            color: #2d3748;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .post-card h3 a:hover {
            color: #5a67d8;
        }

        .post-date {
            display: inline-block;
            font-size: 12px;
            font-weight: 600;
            color: #4c51bf;
            background-color: #ebf8ff;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .post-card p {
            color: #4a5568;
            margin-bottom: 20px;
            font-size: 15px;
        }

        .read-more-btn {
            display: inline-block;
            color: #5a67d8;
            font-weight: 700;
            text-decoration: none;
            font-size: 14px;
            transition: transform 0.2s ease;
        }

        .read-more-btn:hover {
            transform: translateX(4px);
            color: #434190;
        }

        .status-message {
            background: #ffffff;
            padding: 40px;
            text-align: center;
            border-radius: 12px;
            color: #718096;
            font-size: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        footer {
            text-align: center;
            padding: 30px 0 10px 0;
            font-size: 14px;
            color: #718096;
        }
    </style>
</head>
<body>

    <header>
        <h1>USHNISH K CHAKRABORTY</h1>
       <nav>
    <a href="index.html">Home</a> | 
    <a href="sample-links.html">Sample Articles</a> | 
    <a href="about-me.html">About Me</a> | 
    <a href="services-4.html">Services & Pricing</a> | 
    <a href="blog.html">Blog</a> |
    <a href="contact.html">Contact</a>
</nav>
    </header>

    <div class="hero-section">
        <h2>Blog & Writings</h2>
        <p>Insights on marketing, tech, storytelling, and content creation.</p>
    </div>

    <div id="blog-posts-container" class="posts-wrapper">
        <div class="status-message">Loading latest posts...</div>
    </div>

    <footer>
        <p>© 2026 by Ushnish K Chakraborty.</p>
    </footer>

    <!-- Script to auto-fetch posts from GitHub API -->
    <script>
        const repoOwner = 'ushnish3';
        const repoName = 'ushscribbles';
        const container = document.getElementById('blog-posts-container');

        async function fetchBlogPosts() {
            try {
                const response = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/posts`);
                
                if (!response.ok) {
                    if (response.status === 404) {
                        container.innerHTML = '<div class="status-message">No blog posts published yet. Create your first post from the admin dashboard!</div>';
                        return;
                    }
                    throw new Error('Network response error');
                }

                const files = await response.json();
                const mdFiles = files.filter(file => file.name.endsWith('.md'));

                if (mdFiles.length === 0) {
                    container.innerHTML = '<div class="status-message">No blog posts found yet.</div>';
                    return;
                }

                container.innerHTML = ''; // Clear status message

                for (const file of mdFiles) {
                    const fileRes = await fetch(file.download_url);
                    const text = await fileRes.text();

                    // Parse title and date metadata
                    const titleMatch = text.match(/title:\s*["']?(.*?)["']?\n/);
                    const dateMatch = text.match(/date:\s*["']?(.*?)["']?\n/);

                    const title = titleMatch ? titleMatch[1] : file.name.replace('.md', '');
                    const rawDate = dateMatch ? dateMatch[1] : '';
                    const formattedDate = rawDate ? new Date(rawDate).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }) : '';

                    // Get short preview text from post body
                    const bodyText = text.replace(/---[\s\S]*?---/, '').trim().substring(0, 150) + '...';

                    // Build dynamic card
                    const postElement = document.createElement('article');
                    postElement.className = 'post-card';
                    postElement.innerHTML = `
                        ${formattedDate ? `<span class="post-date">${formattedDate}</span>` : ''}
                        <h3><a href="post.html?file=${encodeURIComponent(file.name)}">${title}</a></h3>
                        <p>${bodyText}</p>
                        <a href="post.html?file=${encodeURIComponent(file.name)}" class="read-more-btn">Read Article →</a>
                    `;
                    container.appendChild(postElement);
                }

            } catch (error) {
                console.error('Error fetching posts:', error);
                container.innerHTML = '<div class="status-message">Unable to load posts at this time.</div>';
            }
        }

        fetchBlogPosts();
    </script>
</body>
</html>
