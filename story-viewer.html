    <style>

        nav a {

        .section {

        /* Styling rendered Story Content */
        #story-content p {

            font-size: 14px;

            margin-top: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>USHNISH K CHAKRABORTY</h1>
        <nav>
            <a href="index.html">Home</a> | 
            <a href="sample-links.html">Sample Articles</a> | 
            <a href="about-me.html">About Me</a> | 
            <a href="services-4.html">Services & Pricing</a> | 
            <a href="blog.html">Blog</a> |
            <a href="hobby.html">Hobby Writing</a> |
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <div class="section">
        <h2 id="story-title">Loading...</h2>
        <p class="story-meta" id="story-meta"></p>
        
        <div id="story-content">
            <!-- Story content will load here -->
        </div>

        <a href="hobby.html" class="back-link">← Back to Stories</a>
    </div>

    <footer>
        <p>© 2026 by Ushnish K Chakraborty.</p>
    </footer>

    <script>
        const owner = 'ushnish3';
        const repo = 'ushscribbles';
        const folder = 'stories';

        // Get filename from URL parameters (?file=your-story.md)
        const urlParams = new URLSearchParams(window.location.search);
        const fileName = urlParams.get('file');

        async function loadStory() {
            if (!fileName) {
                document.getElementById('story-content').innerHTML = '<p>Error: No story specified.</p>';
                return;
            }

            try {
                // 1. Fetch the raw Markdown file from GitHub
                const response = await fetch(`https://raw.githubusercontent.com/${owner}/${repo}/main/${folder}/${encodeURIComponent(fileName)}`);
                
                if (!response.ok) throw new Error('Story not found');
                const text = await response.json();

                // 2. Extract metadata and strip frontmatter (assuming the file has Frontmatter)
                const titleMatch = text.match(/title:\s*["']?(.*?)["']?\n/);
                const dateMatch = text.match(/date:\s*["']?(.*?)["']?\n/);

                const title = titleMatch ? titleMatch[1] : fileName.replace('.md', '');
                const rawDate = dateMatch ? dateMatch[1] : '';
                const formattedDate = rawDate ? new Date(rawDate).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }) : '';
                
                // Remove Frontmatter block
                const markdownContent = text.replace(/---[\s\S]*?---/, '').trim();

                // 3. Render the dynamic elements
                document.title = `${title} - Scribbled Stories`;
                document.getElementById('story-title').textContent = title;
                if (formattedDate) {
                    document.getElementById('story-meta').textContent = `Written on: ${formattedDate}`;
                }

                // 4. Use 'marked' library to render Markdown into HTML
                document.getElementById('story-content').innerHTML = marked.parse(markdownContent);

            } catch (error) {
                console.error('Error loading story:', error);
                document.getElementById('story-content').innerHTML = '<p>Error: Unable to load this story.</p>';
            }
        }

        loadStory();
    </script>
</body>
</html>
